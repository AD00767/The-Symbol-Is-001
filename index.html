<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mở Khóa Nội Dung</title>
    <meta name="theme-color" content="#121212">
    <!-- Mở sẵn kết nối tới Supabase để lần kiểm tra mật khẩu nhanh hơn -->
    <link rel="preconnect" href="https://akufleimlxcnftsdmejq.supabase.co" crossorigin>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2c2c2c;
            --text-color: #e0e0e0;
            --muted: #a0a0a0;
            --accent: #4a4a4a;
            --accent-hover: #5a5a5a;
            --line: #2a2a2a;
            --danger: #ff6b6b;
            --warn: #ffa94d;
            --ease: cubic-bezier(.22, .8, .3, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(ellipse at 50% 30%, #1a1a1a 0%, var(--bg-color) 60%);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }

        /* Khung chính */
        .lock-container {
            background: linear-gradient(180deg, #212121 0%, var(--card-bg) 100%);
            padding: 44px 30px 32px;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .04);
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            border: 1px solid var(--line);
            animation: rise .5s var(--ease) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        /* Biểu tượng ổ khóa */
        .lock-icon {
            width: 54px; height: 54px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: grid; place-items: center;
            background: #262626;
            border: 1px solid #333;
            color: #cfcfcf;
            transition: transform .4s var(--ease), color .3s;
        }
        .lock-icon svg { width: 24px; height: 24px; }
        .lock-container.is-locked .lock-icon { color: var(--warn); }
        .lock-container.is-open .lock-icon { transform: scale(1.08); color: #8fd19e; }

        /* Menu 3 chấm */
        .menu-container { position: absolute; top: 12px; left: 12px; }

        .menu-btn {
            background: none; border: none;
            color: var(--muted);
            font-size: 22px; line-height: 1;
            cursor: pointer;
            padding: 6px 11px;
            border-radius: 10px;
            transition: background .2s, color .2s;
        }
        .menu-btn:hover, .menu-btn:focus-visible { background: var(--input-bg); color: #fff; outline: none; }

        .dropdown {
            position: absolute; top: calc(100% + 4px); left: 0;
            width: 140px;
            background: var(--input-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            border: 1px solid #3a3a3a;
            z-index: 10;
            opacity: 0; transform: translateY(-6px) scale(.98);
            transform-origin: top left;
            pointer-events: none; visibility: hidden;
            transition: opacity .18s, transform .18s var(--ease), visibility .18s;
        }
        .dropdown.show { opacity: 1; transform: none; pointer-events: auto; visibility: visible; }

        .dropdown button {
            width: 100%;
            padding: 11px 14px;
            background: none; border: none;
            color: var(--text-color);
            text-align: left; font-size: 14px;
            cursor: pointer;
            transition: background .15s;
        }
        .dropdown button:hover, .dropdown button:focus-visible { background: var(--accent); outline: none; }

        h2 {
            margin-bottom: 8px;
            font-size: 22px; font-weight: 600;
            color: #fff;
            word-break: break-word;
            letter-spacing: .1px;
        }

        .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

        /* Ô nhập mật khẩu */
        .field { position: relative; margin-bottom: 14px; }

        #passwordInput {
            width: 100%;
            height: 48px;
            padding: 0 48px 0 16px;
            background: var(--input-bg);
            border: 1px solid #3d3d3d;
            color: #fff;
            border-radius: 12px;
            font: inherit; font-size: 15px;
            outline: none;
            transition: border-color .25s, box-shadow .25s, background .25s;
        }
        #passwordInput::placeholder { color: #7d7d7d; }
        #passwordInput:focus { border-color: #8a8a8a; box-shadow: 0 0 0 4px rgba(255, 255, 255, .06); }
        #passwordInput.masked { -webkit-text-security: disc; text-security: disc; }

        .eye-btn {
            position: absolute; right: 6px; top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            display: grid; place-items: center;
            background: none; border: none;
            color: var(--muted);
            border-radius: 9px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }
        .eye-btn:hover, .eye-btn:focus-visible { background: #383838; color: #fff; outline: none; }
        .eye-btn svg { width: 20px; height: 20px; }
        .eye-btn .eye-off { display: none; }
        .eye-btn[aria-pressed="true"] .eye-on { display: none; }
        .eye-btn[aria-pressed="true"] .eye-off { display: block; }

        .shake { animation: shake .4s; }
        @keyframes shake {
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Nút Mở khóa */
        .unlock-btn {
            width: 100%; height: 48px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(180deg, #555 0%, var(--accent) 100%);
            color: #fff;
            border: 1px solid #5f5f5f;
            font: inherit; font-size: 15px; font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: filter .2s, transform .1s;
        }
        .unlock-btn:hover:not(:disabled) { filter: brightness(1.12); }
        .unlock-btn:active:not(:disabled) { transform: scale(.985); }
        .unlock-btn:focus-visible { outline: 2px solid #8a8a8a; outline-offset: 2px; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }
        .unlock-btn.loading .spinner { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Khi bị khóa (disabled) */
        input:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
        .unlock-btn.loading:disabled { opacity: 1; cursor: progress; }

        /* Thông báo */
        .msg { min-height: 20px; margin-top: 16px; font-size: 13px; line-height: 1.5; }
        .msg.error { color: var(--danger); }
        .msg.lock  { color: var(--warn); }
        .msg.fade  { animation: fade .3s var(--ease); }
        @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

        /* Popup xem thông tin */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, .7);
            -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; padding: 20px;
            opacity: 0; visibility: hidden;
            transition: opacity .2s, visibility .2s;
        }
        .modal.show { opacity: 1; visibility: visible; }

        .modal-content {
            background: var(--card-bg);
            padding: 26px;
            border-radius: 18px;
            width: 100%; max-width: 340px;
            text-align: left;
            border: 1px solid #333;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
            transform: translateY(10px) scale(.98);
            transition: transform .25s var(--ease);
        }
        .modal.show .modal-content { transform: none; }

        .modal-content h3 { margin-bottom: 12px; color: #fff; font-weight: 600; }
        .modal-content p { font-size: 14px; color: #ccc; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

        .close-btn {
            background: var(--accent); color: #fff;
            border: 1px solid #5f5f5f;
            padding: 9px 20px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
            float: right;
            font-size: 13px;
            transition: background .2s;
        }
        .close-btn:hover { background: var(--accent-hover); }
        .modal-content::after { content: ""; display: block; clear: both; }

        /* Thông báo nhỏ phía dưới */
        .toast {
            position: fixed; left: 50%; bottom: 28px;
            transform: translate(-50%, 20px);
            background: #2c2c2c; color: #eee;
            border: 1px solid #3d3d3d;
            padding: 11px 18px;
            border-radius: 999px;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
            opacity: 0; pointer-events: none;
            transition: opacity .25s, transform .25s var(--ease);
            z-index: 200;
            max-width: calc(100% - 40px); text-align: center;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <main class="lock-container" id="card">
        <!-- Nút 3 chấm và menu -->
        <div class="menu-container">
            <button class="menu-btn" id="menuBtn" aria-label="Tùy chọn" aria-haspopup="true" aria-expanded="false">⋮</button>
            <div class="dropdown" id="dropdownMenu" role="menu">
                <button role="menuitem" id="infoBtn">Thông tin</button>
                <button role="menuitem" id="shareBtn">Chia sẻ</button>
            </div>
        </div>

        <div class="lock-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4.5" y="10.5" width="15" height="10" rx="3"/>
                <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
            </svg>
        </div>

        <!-- Tiêu đề và mô tả -->
        <h2 id="charName">Đang tải...</h2>
        <p class="subtitle" id="subtitleText">Vui lòng nhập mật khẩu để mở khóa</p>

        <!-- Ô nhập & nút bấm -->
        <form id="unlockForm" autocomplete="off" novalidate>
            <div class="field" id="field">
                <input type="text" id="passwordInput" class="masked" placeholder="Mật khẩu..."
                       name="unlock-code" autocomplete="off" autocapitalize="off" autocorrect="off"
                       spellcheck="false" enterkeyhint="go" aria-label="Mật khẩu">
                <button type="button" class="eye-btn" id="eyeBtn" aria-label="Hiện mật khẩu" aria-pressed="false">
                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                    </svg>
                </button>
            </div>
            <button type="submit" id="unlockBtn" class="unlock-btn">
                <span class="spinner" aria-hidden="true"></span>
                <span id="unlockLabel">Mở khóa</span>
            </button>
        </form>

        <!-- Thông báo -->
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </main>

    <!-- Modal Thông tin -->
    <div class="modal" id="infoModal" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="infoTitle">
            <h3 id="infoTitle">Thông tin</h3>
            <p id="charInfo">Đang tải thông tin...</p>
            <button class="close-btn" id="closeBtn">Đóng</button>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // ==========================================
        // 1. THÔNG TIN SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://andgpppjqlxbsrzohvos.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_klHTgvxNfB8gUgxLIiFRmQ_BbSPL-j5';

        // Gọi thẳng REST API (không cần tải thư viện supabase-js -> trang mở nhanh hơn).
        // Với khóa publishable, chỉ gửi qua header "apikey" (không gửi qua Authorization).
        async function rpc(fn, args, timeoutMs = 12000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(args),
                    signal: ctrl.signal
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        // ==========================================
        // 2. LẤY ID NHÂN VẬT TỪ ĐƯỜNG LINK
        // ==========================================
        // Ưu tiên 1: tham số `?id=ten_id`   Ưu tiên 2: subdomain (ten_id.domain.com)
        const urlParams = new URLSearchParams(window.location.search);
        let charId = urlParams.get('id');

        if (!charId) {
            const hostParts = window.location.hostname.split('.');
            charId = (hostParts.length > 2 && hostParts[0] !== 'www') ? hostParts[0] : 'nhanvat1';
        }
        charId = charId.toLowerCase();

        // ==========================================
        // 3. THAM CHIẾU GIAO DIỆN
        // ==========================================
        const $ = (id) => document.getElementById(id);
        const card = $('card'), input = $('passwordInput'), unlockBtn = $('unlockBtn'),
              unlockLabel = $('unlockLabel'), msg = $('msg'), subtitle = $('subtitleText'),
              eyeBtn = $('eyeBtn'), field = $('field');

        const SUBTITLE_DEFAULT = subtitle.innerText;
        let busy = false;        // đang gửi yêu cầu kiểm tra
        let fatal = false;       // không tìm thấy nhân vật / lỗi tải -> không cho nhập
        let lockEnd = 0;         // thời điểm hết khóa (ms)
        let lockTimer = null;

        function showMsg(text, kind) {
            msg.className = 'msg' + (kind ? ' ' + kind + ' fade' : '');
            msg.textContent = text || '';
        }

        function toast(text) {
            const t = $('toast');
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // ==========================================
        // 4. KHÓA: MÁY CHỦ LÀ NƠI QUYẾT ĐỊNH
        //    localStorage chỉ để hiện giao diện khóa tức thì, không có tác dụng bảo mật.
        // ==========================================
        const HINT_KEY = `lock_${charId}`;

        function formatRemaining(ms) {
            const s = Math.max(0, Math.ceil(ms / 1000));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            if (h > 0) return m > 0 ? `${h} giờ ${m} phút` : `${h} giờ`;
            if (m > 0) return `${m} phút ${sec} giây`;
            return `${sec} giây`;
        }

        function renderLock() {
            const left = lockEnd - Date.now();
            if (left <= 0) { clearLock(); return; }
            showMsg(`Bạn đã nhập sai quá 3 lần. Ô nhập bị khóa, thử lại sau ${formatRemaining(left)}.`, 'lock');
        }

        function applyLock(seconds) {
            lockEnd = Date.now() + seconds * 1000;
            try { localStorage.setItem(HINT_KEY, JSON.stringify({ until: lockEnd })); } catch (e) {}
            input.disabled = true;
            unlockBtn.disabled = true;
            card.classList.add('is-locked');
            subtitle.innerText = 'Truy cập tạm thời bị khóa';
            renderLock();
            clearInterval(lockTimer);
            lockTimer = setInterval(renderLock, 1000);
        }

        function clearLock() {
            clearInterval(lockTimer);
            lockEnd = 0;
            try { localStorage.removeItem(HINT_KEY); } catch (e) {}
            card.classList.remove('is-locked');
            if (fatal) return;
            input.disabled = false;
            unlockBtn.disabled = false;
            subtitle.innerText = SUBTITLE_DEFAULT;
            showMsg('');
        }

        // Hiện khóa ngay từ gợi ý cục bộ (nếu có) cho đỡ nháy, rồi để máy chủ xác nhận
        try {
            const hint = JSON.parse(localStorage.getItem(HINT_KEY) || 'null');
            if (hint && hint.until > Date.now()) applyLock((hint.until - Date.now()) / 1000);
        } catch (e) {}

        // ==========================================
        // 5. TẢI DỮ LIỆU (chạy song song)
        // ==========================================
        async function loadData() {
            const infoReq = rpc('get_character_info', { char_id: charId });
            const lockReq = rpc('lock_status', { p_char: charId });

            try {
                const data = await infoReq;
                if (data && data.name) {
                    $('charName').innerText = data.name;
                    $('charInfo').innerText = data.info || 'Không có thông tin thêm.';
                } else {
                    fatal = true;
                    $('charName').innerText = 'Không tìm thấy nhân vật';
                    subtitle.innerText = 'Vui lòng kiểm tra lại đường link (id)';
                    input.disabled = true;
                    unlockBtn.disabled = true;
                }
            } catch (err) {
                console.error('Lỗi kết nối Supabase:', err);
                fatal = true;
                $('charName').innerText = 'Lỗi kết nối';
                subtitle.innerText = 'Không thể lấy dữ liệu từ máy chủ';
                input.disabled = true;
                unlockBtn.disabled = true;
            }

            try {
                const st = await lockReq;
                if (st && st.locked) applyLock(st.retry_after);
                else if (lockEnd) clearLock();   // máy chủ nói không khóa -> bỏ gợi ý cũ
            } catch (err) {
                console.error('Không lấy được trạng thái khóa:', err);
            }
        }
        loadData();

        // ==========================================
        // 6. Ô NHẬP: HIỆN/ẨN MẬT KHẨU, GÕ CÓ DẤU
        // ==========================================
        // Dùng ô text được che bằng CSS để bộ gõ tiếng Việt hoạt động ổn định.
        // Trình duyệt nào không hỗ trợ che bằng CSS thì tự quay về type="password".
        const canMaskByCss = !!(window.CSS && CSS.supports && CSS.supports('-webkit-text-security', 'disc'));
        let revealed = false;

        function applyReveal() {
            if (canMaskByCss) {
                input.type = 'text';
                input.classList.toggle('masked', !revealed);
            } else {
                input.type = revealed ? 'text' : 'password';
                input.classList.remove('masked');
            }
            eyeBtn.setAttribute('aria-pressed', String(revealed));
            eyeBtn.setAttribute('aria-label', revealed ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        }
        applyReveal();

        // preventDefault để bấm nút mắt không làm mất focus của ô nhập
        eyeBtn.addEventListener('mousedown', (e) => e.preventDefault());
        eyeBtn.addEventListener('click', () => { revealed = !revealed; applyReveal(); input.focus(); });

        // ==========================================
        // 7. MỞ KHÓA
        // ==========================================
        function setBusy(on) {
            busy = on;
            unlockBtn.classList.toggle('loading', on);
            unlockLabel.textContent = on ? 'Đang kiểm tra...' : 'Mở khóa';
            if (on) unlockBtn.disabled = true;
            else if (!lockEnd && !fatal) unlockBtn.disabled = false;
        }

        function wrongAnim() {
            field.classList.remove('shake');
            void field.offsetWidth;          // khởi động lại animation
            field.classList.add('shake');
        }

        async function unlock() {
            if (busy || lockEnd || fatal) return;

            // trim + chuẩn hóa Unicode (NFC) để dấu tiếng Việt luôn khớp dù gõ bằng bộ gõ nào
            const pass = input.value.trim().normalize('NFC');
            if (!pass) { input.focus(); wrongAnim(); return; }

            showMsg('');
            setBusy(true);

            try {
                const res = await rpc('try_unlock', { p_char: charId, p_pass: pass });
                setBusy(false);

                if (res && res.ok && res.url) {
                    card.classList.add('is-open');
                    unlockLabel.textContent = 'Đã mở khóa ✓';
                    try { localStorage.removeItem(HINT_KEY); } catch (e) {}
                    window.location.href = res.url;
                    return;
                }

                input.value = '';
                if (res && res.locked) {
                    applyLock(res.retry_after || 86400);
                } else {
                    wrongAnim();
                    const left = res && typeof res.remaining === 'number' ? res.remaining : null;
                    showMsg(left === null
                        ? 'Mật khẩu không chính xác!'
                        : `Mật khẩu không chính xác! Bạn còn ${left} lần thử.`, 'error');
                    input.focus();
                }
            } catch (err) {
                console.error(err);
                setBusy(false);
                toast('Lỗi kết nối máy chủ! Vui lòng thử lại sau.');
            }
        }

        $('unlockForm').addEventListener('submit', (e) => { e.preventDefault(); unlock(); });
        // Enter khi đang gõ dở dấu (bộ gõ) sẽ không bị tính là gửi, vì form chỉ submit khi hết composition

        // ==========================================
        // 8. MENU, MODAL, CHIA SẺ
        // ==========================================
        const menu = $('dropdownMenu'), menuBtn = $('menuBtn'), modal = $('infoModal');

        function setMenu(open) {
            menu.classList.toggle('show', open);
            menuBtn.setAttribute('aria-expanded', String(open));
        }
        menuBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenu(!menu.classList.contains('show')); });
        document.addEventListener('click', (e) => { if (!menu.contains(e.target)) setMenu(false); });

        function openInfo() { setMenu(false); modal.classList.add('show'); modal.setAttribute('aria-hidden', 'false'); $('closeBtn').focus(); }
        function closeInfo() { modal.classList.remove('show'); modal.setAttribute('aria-hidden', 'true'); }

        $('infoBtn').addEventListener('click', openInfo);
        $('closeBtn').addEventListener('click', closeInfo);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeInfo(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeInfo(); setMenu(false); }
        });

        $('shareBtn').addEventListener('click', async () => {
            setMenu(false);
            try {
                await navigator.clipboard.writeText(window.location.href);
                toast('Đã sao chép đường link dẫn tới ô mở khóa này!');
            } catch (e) {
                toast('Không thể tự động chép link. Vui lòng copy trên thanh địa chỉ.');
            }
        });
    </script>
</body>
</html>
